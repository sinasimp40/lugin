<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Denfi Session Computer Preview</title>
  <style>
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; font-family:Arial,sans-serif; }
    body {
      background:
        radial-gradient(circle at 72% 35%, rgba(237,78,32,.28), transparent 22%),
        radial-gradient(circle at 28% 65%, rgba(0,126,186,.22), transparent 28%),
        linear-gradient(145deg,#09101b 0%,#172234 48%,#070b12 100%);
      color:white;
    }
    .desktop { position:relative; width:100%; height:100%; overflow:hidden; }
    .game-scene { position:absolute; inset:0 0 42px; display:grid; place-items:center; overflow:hidden; }
    .horizon { position:absolute; left:-10%; right:-10%; bottom:14%; height:35%; background:linear-gradient(165deg,transparent 48%,rgba(255,106,38,.16) 49%,rgba(4,8,14,.75) 51%); transform:skewY(-4deg); }
    .crosshair { width:72px; height:72px; position:relative; opacity:.72; }
    .crosshair:before,.crosshair:after { content:""; position:absolute; background:rgba(255,255,255,.7); box-shadow:0 0 7px rgba(255,255,255,.5); }
    .crosshair:before { width:1px; height:72px; left:35px; }
    .crosshair:after { height:1px; width:72px; top:35px; }
    .hud { position:absolute; left:28px; top:24px; font:700 12px monospace; letter-spacing:2px; color:rgba(255,255,255,.7); }
    .hud strong { display:block; margin-top:8px; font-size:25px; color:#fff; }
    .hint {
      position:absolute; top:18px; left:50%; transform:translateX(-50%);
      padding:9px 14px; background:rgba(5,9,14,.78); border:1px solid rgba(255,255,255,.15);
      border-radius:5px; font-size:12px; color:#d6dde8; backdrop-filter:blur(8px);
    }
    .taskbar { position:absolute; left:0; right:0; bottom:0; height:42px; display:flex; align-items:center; gap:9px; padding:0 12px; background:rgba(9,14,22,.88); border-top:1px solid rgba(255,255,255,.1); backdrop-filter:blur(14px); }
    .start { width:23px; height:23px; display:grid; grid-template-columns:1fr 1fr; gap:2px; }
    .start i { background:#78bfff; }
    .app-dot { width:24px; height:24px; border-radius:5px; background:linear-gradient(145deg,#2b6ead,#133655); border:1px solid rgba(255,255,255,.2); }
    .clock { margin-left:auto; text-align:right; font-size:10px; line-height:1.35; color:#dfe5ed; }
    .session-frame {
      position:absolute; right:10px; bottom:52px; width:276px; height:42px;
      border:0; background:transparent; z-index:10; transition:height .16s ease;
      filter:drop-shadow(0 5px 18px rgba(0,0,0,.62));
    }
    @media(max-width:520px) {
      .session-frame { right:4px; width:min(360px,calc(100vw - 8px)); }
      .hint { width:calc(100% - 24px); text-align:center; }
    }
  </style>
</head>
<body>
  <main class="desktop">
    <div class="game-scene">
      <div class="horizon"></div>
      <div class="hud">ARENA / ROUND 08<strong>12 — 09</strong></div>
      <div class="crosshair"></div>
    </div>
    <div class="hint">Interactive demo — use ORDER, RANKING, and LOGOUT in the bottom-right overlay</div>
    <div class="taskbar">
      <div class="start"><i></i><i></i><i></i><i></i></div>
      <div class="app-dot"></div>
      <div class="clock"><span id="clock">10:24 PM</span><br>9/16/2026</div>
    </div>
    <iframe class="session-frame" id="session-frame" title="Interactive Denfi session overlay" src="/session.html?preview=1"></iframe>
  </main>
  <script>
    const frame = document.getElementById('session-frame');
    window.addEventListener('message', event => {
      if (event.origin !== location.origin || event.source !== frame.contentWindow) return;
      if (event.data && event.data.type === 'denfi-overlay-resize') {
      frame.style.height = event.data.expanded ? '211px' : '42px';
      }
    });
    function updateClock() {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    }
    updateClock();
    setInterval(updateClock, 30000);
  </script>
</body>
</html>
