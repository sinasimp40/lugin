<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Session</title>
<style>
  @font-face {
    font-family: 'Orbitron';
    font-style: normal;
    font-weight: 400 900;
    font-display: swap;
    src: local('Orbitron'), url('fonts/orbitron.woff2') format('woff2');
    unicode-range: U+0000-00FF;
  }
  @font-face {
    font-family: 'Share Tech Mono';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: local('Share Tech Mono'), url('fonts/share-tech-mono.woff2') format('woff2');
    unicode-range: U+0000-00FF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }

  .strip {
    width: 100%; height: 100%;
    display: flex; align-items: stretch;
    padding: 0;
    background: linear-gradient(180deg, #0d0d0d 0%, #080808 100%);
    border-radius: 3px;
    border: none;
    border-left: 2px solid #ff8c00;
    border-right: 2px solid #ff8c00;
    -webkit-app-region: drag; cursor: move;
    position: relative; overflow: hidden;
    transition: border-color 0.3s;
  }

  .neon-line-left, .neon-line-right {
    position: absolute; top: 0; bottom: 0; width: 2px;
    background: linear-gradient(180deg, transparent 0%, #ff8c00 20%, #ffb347 50%, #ff8c00 80%, transparent 100%);
    box-shadow: 0 0 6px rgba(255,140,0,0.5), 0 0 15px rgba(255,140,0,0.25);
    z-index: 2;
  }
  .neon-line-left { left: 0; }
  .neon-line-right { right: 0; }

  .neon-glow-left, .neon-glow-right {
    position: absolute; top: 10%; bottom: 10%; width: 10px;
    pointer-events: none; z-index: 1;
  }
  .neon-glow-left {
    left: 0;
    background: radial-gradient(ellipse at left, rgba(255,140,0,0.12), transparent 70%);
  }
  .neon-glow-right {
    right: 0;
    background: radial-gradient(ellipse at right, rgba(255,140,0,0.12), transparent 70%);
  }

  .sweep {
    position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,140,0,0.02), rgba(255,140,0,0.05), rgba(255,140,0,0.02), transparent);
    animation: sweep 3s ease-in-out infinite;
    pointer-events: none; z-index: 1;
  }
  @keyframes sweep { 0% { left: -40%; } 100% { left: 140%; } }

  .scanline {
    position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,140,0,0.012) 2px, rgba(255,140,0,0.012) 4px);
  }

  canvas#bg-anim {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    width: 100%; height: 100%;
  }

  .points-zone {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, rgba(255,215,64,0.12) 0%, rgba(255,215,64,0.04) 100%);
    border-right: 1px solid rgba(255,215,64,0.25);
    padding: 0 10px;
    min-width: 60px;
    position: relative; z-index: 3;
    box-shadow: inset -4px 0 8px rgba(255,215,64,0.04);
  }
  .points-zone.active { display: flex; }
  .points-zone .pts-value {
    font-family: 'Orbitron', monospace;
    font-size: 16px; font-weight: 900;
    color: #ffd740;
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(255,215,64,0.7), 0 0 20px rgba(255,215,64,0.35);
    line-height: 1;
    white-space: nowrap;
  }
  .points-zone .pts-label {
    font-family: 'Orbitron', monospace;
    font-size: 5px; font-weight: 700;
    letter-spacing: 2px;
    color: rgba(255,215,64,0.5);
    margin-top: 2px;
  }
  .strip.danger-mode .points-zone {
    border-color: rgba(255,215,64,0.12);
    background: linear-gradient(180deg, rgba(255,215,64,0.06) 0%, rgba(255,215,64,0.02) 100%);
  }
  .strip.danger-mode .points-zone .pts-value { color: rgba(255,215,64,0.5); }
  .strip.danger-mode .points-zone .pts-label { color: rgba(255,215,64,0.3); }

  .main-section {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding: 4px 10px;
    position: relative; z-index: 3;
    gap: 3px;
  }

  .top-row {
    display: flex; align-items: center; justify-content: space-between;
  }

  .bottom-row {
    display: flex; align-items: center; justify-content: space-between;
  }

  .timer {
    font-family: 'Orbitron', monospace;
    font-size: 14px; font-weight: 700;
    color: #ff8c00;
    letter-spacing: 1px; line-height: 1;
    text-shadow: 0 0 8px rgba(255,140,0,0.4), 0 0 20px rgba(255,140,0,0.15);
    white-space: nowrap;
  }
  .timer.critical {
    color: #ff2200;
    text-shadow: 0 0 10px rgba(255,34,0,0.7), 0 0 25px rgba(255,34,0,0.4);
    animation: critical-flash 0.5s ease-in-out infinite;
  }
  @keyframes critical-flash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  .user-row {
    display: flex; align-items: center; gap: 4px;
  }

  .status-dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: #22cc44;
    box-shadow: 0 0 3px rgba(34,204,68,0.6), 0 0 6px rgba(34,204,68,0.3);
    flex-shrink: 0;
    animation: dot-pulse 2s ease-in-out infinite;
  }
  @keyframes dot-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .user {
    font-family: 'Share Tech Mono', monospace;
    font-size: 8px; color: rgba(255,140,0,0.7);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 80px; letter-spacing: 0.5px;
    text-shadow: 0 0 4px rgba(255,140,0,0.2);
  }
  .pc-label {
    font-family: 'Orbitron', monospace;
    font-size: 6px; font-weight: 700;
    color: rgba(255,140,0,0.5);
    letter-spacing: 1px;
    text-shadow: 0 0 4px rgba(255,140,0,0.15);
    white-space: nowrap;
    display: none;
  }
  .pc-label.active { display: block; }

  .logout-btn {
    -webkit-app-region: no-drag;
    background: transparent;
    border: 1px solid rgba(255,140,0,0.3);
    color: #ff8c00; padding: 3px 8px;
    border-radius: 2px; cursor: pointer;
    font-family: 'Share Tech Mono', monospace;
    font-size: 7px; font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase;
    transition: all 0.3s;
    position: relative; overflow: hidden;
    flex-shrink: 0; margin-left: auto;
  }
  .logout-btn::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,140,0,0.1), transparent);
    transform: translateX(-100%);
    transition: transform 0.4s;
  }
  .logout-btn:hover {
    background: rgba(255,140,0,0.12);
    border-color: rgba(255,140,0,0.6);
    box-shadow: 0 0 8px rgba(255,140,0,0.2);
  }
  .logout-btn:hover::before { transform: translateX(100%); }

  .strip.danger-mode {
    border-left: 2px solid #ff2200;
    border-right: 2px solid #ff2200;
    animation: strip-danger 1s ease-in-out infinite;
  }
  @keyframes strip-danger {
    0%, 100% { box-shadow: inset 0 0 6px rgba(255,34,0,0.03); }
    50% { box-shadow: inset 0 0 15px rgba(255,34,0,0.1), 0 0 10px rgba(255,34,0,0.25); }
  }
  .strip.danger-mode .neon-line-left,
  .strip.danger-mode .neon-line-right {
    background: linear-gradient(180deg, transparent 0%, #ff2200 20%, #ff4400 50%, #ff2200 80%, transparent 100%);
    box-shadow: 0 0 8px rgba(255,34,0,0.6), 0 0 20px rgba(255,34,0,0.3);
    animation: neon-danger 0.8s ease-in-out infinite;
  }
  @keyframes neon-danger {
    0%, 100% { opacity: 1; box-shadow: 0 0 8px rgba(255,34,0,0.6), 0 0 20px rgba(255,34,0,0.3); }
    50% { opacity: 0.4; box-shadow: 0 0 15px rgba(255,34,0,0.9), 0 0 30px rgba(255,0,0,0.5); }
  }
  .strip.danger-mode .neon-glow-left {
    background: radial-gradient(ellipse at left, rgba(255,34,0,0.2), transparent 70%);
  }
  .strip.danger-mode .neon-glow-right {
    background: radial-gradient(ellipse at right, rgba(255,34,0,0.2), transparent 70%);
  }
  .strip.danger-mode .status-dot {
    background: #ff2200;
    box-shadow: 0 0 4px rgba(255,34,0,0.6);
    animation: dot-danger 0.5s ease-in-out infinite;
  }
  @keyframes dot-danger {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }
  .strip.danger-mode .user { color: rgba(255,34,0,0.7); }
  .strip.danger-mode .logout-btn {
    border-color: rgba(255,34,0,0.4);
    color: #ff2200;
  }
  .strip.danger-mode .sweep {
    background: linear-gradient(90deg, transparent, rgba(255,34,0,0.03), rgba(255,34,0,0.06), rgba(255,34,0,0.03), transparent);
  }

  .strip { position:absolute; left:0; right:0; bottom:0; height:70px; }
  .drawer {
    display:none; position:absolute; left:0; right:0; bottom:70px; height:282px;
    background:linear-gradient(160deg,#111216,#090a0c); border:1px solid rgba(255,140,0,.4);
    border-top:2px solid #ff8c00; box-shadow:0 -8px 30px rgba(0,0,0,.7); overflow:hidden;
    font-family:'Share Tech Mono',monospace; color:#eee; -webkit-app-region:no-drag;
  }
  .drawer.active { display:flex; flex-direction:column; }
  .drawer-head { display:flex; justify-content:space-between; align-items:center; padding:11px 13px; border-bottom:1px solid rgba(255,140,0,.18); }
  .drawer-title { font:800 12px 'Orbitron',monospace; letter-spacing:1px; color:#ffb13d; }
  .drawer-close { border:0; background:transparent; color:#a98a68; font-size:18px; cursor:pointer; padding:0 3px; }
  .drawer-body { flex:1; min-height:0; overflow:auto; padding:10px 12px; }
  .product-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .product {
    display:flex; align-items:center; justify-content:space-between; gap:6px; min-width:0;
    border:1px solid rgba(255,140,0,.17); background:rgba(255,140,0,.045); padding:8px;
  }
  .product-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:10px; color:#f0dfca; }
  .product-price { color:#ffb13d; font-size:10px; margin-top:2px; }
  .add-btn { flex:0 0 24px; height:24px; border:1px solid #ff8c00; background:#ff8c00; color:#171009; font-size:16px; cursor:pointer; }
  .empty-state { color:#806e5c; text-align:center; padding:35px 10px; font-size:10px; line-height:1.6; }
  .cart-bar { display:flex; align-items:center; gap:8px; padding:9px 12px; border-top:1px solid rgba(255,140,0,.22); background:#171109; }
  .cart-summary { flex:1; min-width:0; font-size:9px; color:#9b8268; }
  .cart-summary strong { display:block; color:#ffd08a; font-size:11px; }
  .clear-cart { border:0; background:transparent; color:#986b45; font:9px 'Share Tech Mono'; cursor:pointer; }
  .order-btn { border:1px solid #ff9b1a; background:#ff8c00; color:#171009; padding:8px 12px; font:800 8px 'Orbitron'; letter-spacing:1px; cursor:pointer; }
  .order-btn:disabled { opacity:.35; cursor:not-allowed; }
  .rank-list { display:flex; flex-direction:column; gap:5px; }
  .rank-row { display:grid; grid-template-columns:28px 1fr auto; gap:7px; align-items:center; padding:7px 9px; border:1px solid rgba(255,140,0,.12); background:rgba(255,255,255,.018); }
  .rank-row.me { border-color:#ff8c00; background:rgba(255,140,0,.11); }
  .rank-no { font:800 12px 'Orbitron'; color:#ffb13d; }
  .rank-user { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11px; }
  .rank-coins { text-align:right; color:#ffd08a; font-size:10px; }
  .rank-coins span { display:block; color:#74614e; font-size:7px; letter-spacing:1px; }
  .drawer-note { font-size:8px; color:#6e5d4b; padding:8px 12px; border-top:1px solid rgba(255,140,0,.12); }
  .toast { display:none; position:absolute; left:12px; right:12px; bottom:10px; padding:9px; background:#172318; border:1px solid #3d8b48; color:#8cdf97; font-size:10px; text-align:center; z-index:8; }
  .toast.active { display:block; }

  /* Reference-inspired three-zone session bar:
     points block | readable session details | dedicated action dock */
  .strip {
    height:70px;
    background:linear-gradient(180deg,#1a1a1a 0%,#111 100%);
    border-left:1px solid rgba(255,140,0,.65);
    border-right:1px solid rgba(255,140,0,.65);
    border-radius:2px;
  }
  .points-zone,
  .points-zone.active {
    display:flex;
    flex:0 0 92px;
    width:92px;
    min-width:92px;
    padding:0 8px;
    background:#f4ef12;
    border:0;
    box-shadow:none;
  }
  .points-zone .pts-value {
    color:#121212;
    font-size:18px;
    letter-spacing:.3px;
    text-shadow:none;
  }
  .points-zone .pts-label {
    color:#252500;
    font-size:8px;
    letter-spacing:1.4px;
    margin-top:4px;
  }
  .main-section {
    flex:1 1 auto;
    padding:8px 16px;
    gap:6px;
  }
  .top-row,
  .bottom-row {
    justify-content:flex-start;
  }
  .timer {
    color:#f4f4f4;
    font-size:18px;
    font-weight:700;
    letter-spacing:.6px;
    text-shadow:0 1px 5px rgba(255,255,255,.16);
  }
  .user-row { gap:7px; }
  .status-dot { width:6px; height:6px; }
  .user {
    max-width:190px;
    color:#e7e7e7;
    font-size:13px;
    letter-spacing:.2px;
    text-shadow:none;
  }
  .pc-label {
    color:#a9a9a9;
    font-size:8px;
    letter-spacing:.8px;
  }
  .action-area {
    flex:0 0 118px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:stretch;
    gap:2px;
    padding:5px 10px 5px 0;
    position:relative;
    z-index:3;
  }
  .quick-actions {
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:1px;
    margin:0;
  }
  .quick-btn {
    width:100%;
    min-height:16px;
    padding:1px 2px;
    border:0;
    background:transparent;
    color:#f1f1f1;
    font-size:10px;
    letter-spacing:.4px;
    white-space:nowrap;
  }
  .quick-btn:hover,
  .quick-btn.active {
    background:rgba(255,240,0,.1);
    color:#fff719;
    border:0;
    box-shadow:none;
  }
  .logout-btn {
    align-self:stretch;
    min-width:0;
    min-height:16px;
    margin:0;
    padding:1px 8px;
    border:0;
    color:#dedede;
    font-size:10px;
    letter-spacing:.5px;
  }
  .logout-btn:hover {
    background:rgba(255,70,45,.13);
    border:0;
    color:#ff9587;
    box-shadow:none;
  }
  .logout-btn::before { display:none; }
</style>
</head>
<body>
  <div class="strip" id="strip">
    <canvas id="bg-anim"></canvas>
    <div class="scanline"></div>
    <div class="sweep"></div>
    <div class="neon-line-left"></div>
    <div class="neon-line-right"></div>
    <div class="neon-glow-left"></div>
    <div class="neon-glow-right"></div>
    <div class="points-zone" id="points-zone"></div>
    <div class="main-section">
      <div class="top-row">
        <div class="timer" id="timer">--:--:--</div>
      </div>
      <div class="bottom-row">
        <div class="user-row">
          <div class="status-dot" id="status-dot"></div>
          <div class="user" id="username">User</div>
          <div class="pc-label" id="pc-label"></div>
        </div>
      </div>
    </div>
      <div class="action-area">
        <div class="quick-actions">
          <button class="quick-btn" id="shop-btn" type="button">ORDER</button>
          <button class="quick-btn" id="rank-btn" type="button">RANKING</button>
        </div>
        <button class="logout-btn" id="logout-btn">LOGOUT</button>
      </div>
  </div>
  <section class="drawer" id="drawer" aria-label="Session tools">
    <header class="drawer-head">
      <div class="drawer-title" id="drawer-title">QUICK ORDER</div>
      <button class="drawer-close" id="drawer-close" type="button" aria-label="Close">&times;</button>
    </header>
    <div class="drawer-body">
      <div id="store-view">
        <div class="product-grid" id="product-grid"></div>
      </div>
      <div id="rank-view" style="display:none">
        <div class="rank-list" id="rank-list"></div>
      </div>
    </div>
    <div class="cart-bar" id="cart-bar">
      <div class="cart-summary"><span id="cart-count">0 items</span><strong id="cart-total">&#8369;0</strong></div>
      <button class="clear-cart" id="clear-cart" type="button">CLEAR</button>
      <button class="order-btn" id="place-order" type="button" disabled>PLACE ORDER</button>
    </div>
    <div class="drawer-note" id="rank-note" style="display:none">ALL-TIME RANKING FROM COIN LOGS</div>
    <div class="toast" id="order-toast"></div>
  </section>

  <script>
    (function() {
      const c = document.getElementById('bg-anim');
      const ctx = c.getContext('2d');
      let isDanger = false;
      function resize() { c.width = c.offsetWidth; c.height = c.offsetHeight; }
      resize();
      window.addEventListener('resize', resize);

      const particles = [];
      const GRID_SPACING = 12;
      let offset = 0;

      function drawGrid() {
        const r = isDanger ? 255 : 255;
        const g = isDanger ? 34 : 140;
        const b = isDanger ? 0 : 0;
        ctx.strokeStyle = `rgba(${r},${g},${b},0.03)`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        for (let x = (offset % GRID_SPACING); x < c.width; x += GRID_SPACING) {
          ctx.moveTo(x, 0); ctx.lineTo(x, c.height);
        }
        for (let y = 0; y < c.height; y += GRID_SPACING) {
          ctx.moveTo(0, y); ctx.lineTo(c.width, y);
        }
        ctx.stroke();
      }

      function spawnParticle() {
        return {
          x: -2,
          y: Math.random() * c.height,
          vx: 0.3 + Math.random() * 0.5,
          size: 0.5 + Math.random() * 1,
          alpha: 0.1 + Math.random() * 0.3,
          trail: []
        };
      }

      function animate() {
        ctx.clearRect(0, 0, c.width, c.height);
        offset += 0.15;
        drawGrid();

        isDanger = document.getElementById('strip').classList.contains('danger-mode');
        const r = isDanger ? 255 : 255;
        const g = isDanger ? 50 : 160;
        const b = isDanger ? 0 : 0;

        if (particles.length < 6 && Math.random() < 0.03) {
          particles.push(spawnParticle());
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.trail.push({ x: p.x, y: p.y });
          if (p.trail.length > 8) p.trail.shift();

          for (let t = 0; t < p.trail.length; t++) {
            const tp = p.trail[t];
            const ta = (t / p.trail.length) * p.alpha * 0.3;
            ctx.fillStyle = `rgba(${r},${g},${b},${ta})`;
            ctx.fillRect(tp.x - p.size * 0.3, tp.y - p.size * 0.3, p.size * 0.6, p.size * 0.6);
          }

          ctx.fillStyle = `rgba(${r},${g},${b},${p.alpha})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2);
          ctx.fill();

          if (p.x > c.width + 5) particles.splice(i, 1);
        }

        requestAnimationFrame(animate);
      }
      animate();

      window._setBgDanger = (v) => { isDanger = v; };
    })();

    let timeLeft = 0;
    let interval = null;
    let logoutLink = '';
    let sessionUsername = '';
    let sessionIp = '';
    let sessionMac = '';
    let ws = null;
    let wsReconnectTimer = null;
    let autoLogoutTriggered = false;
    let checkingExpiry = false;
    let storeProducts = [];
    let cart = {};
    let activeDrawer = null;
    const previewMode = new URLSearchParams(location.search).get('preview') === '1';

    function setOverlayExpanded(expanded) {
      if (window.electronAPI && window.electronAPI.resizeSessionOverlay) {
        window.electronAPI.resizeSessionOverlay(expanded);
      }
      if (previewMode && window.parent !== window) {
        window.parent.postMessage({ type: 'denfi-overlay-resize', expanded }, location.origin);
      }
    }

    function closeDrawer() {
      activeDrawer = null;
      document.getElementById('drawer').classList.remove('active');
      document.getElementById('shop-btn').classList.remove('active');
      document.getElementById('rank-btn').classList.remove('active');
      setOverlayExpanded(false);
    }

    function openDrawer(view) {
      if (activeDrawer === view) { closeDrawer(); return; }
      activeDrawer = view;
      document.getElementById('drawer').classList.add('active');
      document.getElementById('shop-btn').classList.toggle('active', view === 'shop');
      document.getElementById('rank-btn').classList.toggle('active', view === 'rank');
      document.getElementById('store-view').style.display = view === 'shop' ? '' : 'none';
      document.getElementById('rank-view').style.display = view === 'rank' ? '' : 'none';
      document.getElementById('cart-bar').style.display = view === 'shop' ? 'flex' : 'none';
      document.getElementById('rank-note').style.display = view === 'rank' ? '' : 'none';
      document.getElementById('drawer-title').textContent = view === 'shop' ? 'QUICK ORDER' : 'TOP 5 REGULARS';
      setOverlayExpanded(true);
      if (view === 'shop') loadProducts();
      else loadLeaderboard();
    }

    function money(value) {
      const number = Number(value) || 0;
      return '\u20b1' + (Number.isInteger(number) ? number : number.toFixed(2));
    }

    async function loadProducts() {
      if (previewMode) {
        storeProducts = [
          { id: 'preview-coke', name: 'Coke', price: 35 },
          { id: 'preview-water', name: 'Bottled Water', price: 20 },
          { id: 'preview-noodles', name: 'Cup Noodles', price: 45 },
          { id: 'preview-chips', name: 'Potato Chips', price: 30 },
          { id: 'preview-coffee', name: 'Iced Coffee', price: 55 },
          { id: 'preview-sandwich', name: 'Ham Sandwich', price: 65 }
        ];
        renderProducts();
        return;
      }
      try {
        const response = await fetch('/api/session/store');
        const data = await response.json();
        storeProducts = Array.isArray(data.products) ? data.products : [];
      } catch (_) { storeProducts = []; }
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = '';
      if (!storeProducts.length) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">No products are available.<br>Ask the administrator to add products.</div>';
        return;
      }
      storeProducts.forEach(product => {
        const row = document.createElement('div');
        row.className = 'product';
        const info = document.createElement('div');
        info.style.minWidth = '0';
        const name = document.createElement('div');
        name.className = 'product-name';
        name.textContent = product.name;
        const price = document.createElement('div');
        price.className = 'product-price';
        price.textContent = money(product.price);
        const add = document.createElement('button');
        add.className = 'add-btn';
        add.type = 'button';
        add.textContent = '+';
        add.setAttribute('aria-label', 'Add ' + product.name);
        add.addEventListener('click', () => {
          cart[product.id] = (cart[product.id] || 0) + 1;
          renderCart();
        });
        info.append(name, price);
        row.append(info, add);
        grid.appendChild(row);
      });
    }

    function renderCart() {
      const items = storeProducts.filter(product => cart[product.id]);
      const count = items.reduce((sum, product) => sum + cart[product.id], 0);
      const total = items.reduce((sum, product) => sum + product.price * cart[product.id], 0);
      document.getElementById('cart-count').textContent = count + (count === 1 ? ' item' : ' items');
      document.getElementById('cart-total').textContent = money(total);
      document.getElementById('place-order').disabled = count === 0;
    }

    async function placeOrder() {
      const items = Object.entries(cart).map(([id, quantity]) => ({ id, quantity }));
      if (!items.length) return;
      const button = document.getElementById('place-order');
      button.disabled = true;
      button.textContent = 'SENDING...';
      if (previewMode) {
        await new Promise(resolve => setTimeout(resolve, 450));
        cart = {};
        renderCart();
        showOrderToast('DEMO ORDER SENT — PLEASE WAIT AT YOUR PC');
        button.textContent = 'PLACE ORDER';
        return;
      }
      try {
        const response = await fetch('/api/session/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items })
        });
        const data = await response.json();
        if (!data.success) throw new Error(data.error || 'Order failed');
        cart = {};
        renderCart();
        showOrderToast('ORDER SENT — PLEASE WAIT AT YOUR PC');
      } catch (error) {
        showOrderToast(error.message || 'Could not send order', true);
      } finally {
        button.textContent = 'PLACE ORDER';
        button.disabled = Object.keys(cart).length === 0;
      }
    }

    function showOrderToast(message, isError) {
      const toast = document.getElementById('order-toast');
      toast.textContent = message;
      toast.style.background = isError ? '#2b1512' : '#172318';
      toast.style.borderColor = isError ? '#a64235' : '#3d8b48';
      toast.style.color = isError ? '#ff8f80' : '#8cdf97';
      toast.classList.add('active');
      setTimeout(() => toast.classList.remove('active'), 3000);
    }

    async function loadLeaderboard() {
      const list = document.getElementById('rank-list');
      list.innerHTML = '<div class="empty-state">Loading coin ranking...</div>';
      if (previewMode) {
        renderLeaderboard([
          { username: 'mem-carlo', coins: 340 },
          { username: 'mem-alice', coins: 280 },
          { username: 'mem-gina', coins: 275 },
          { username: 'mem-player-one', coins: 250 },
          { username: 'mem-diana', coins: 225 }
        ]);
        return;
      }
      try {
        const response = await fetch('/api/session/leaderboard');
        const data = await response.json();
        const leaderboard = Array.isArray(data.leaderboard) ? data.leaderboard : [];
        renderLeaderboard(leaderboard);
      } catch (_) {
        list.innerHTML = '<div class="empty-state">Ranking is temporarily unavailable.</div>';
      }
    }

    function renderLeaderboard(leaderboard) {
      const list = document.getElementById('rank-list');
      list.innerHTML = '';
      if (!leaderboard.length) {
        list.innerHTML = '<div class="empty-state">No coin activity recorded yet.</div>';
        return;
      }
      leaderboard.forEach((member, index) => {
          const row = document.createElement('div');
          row.className = 'rank-row' + (member.username.toLowerCase() === sessionUsername.toLowerCase() ? ' me' : '');
          const rank = document.createElement('div');
          rank.className = 'rank-no';
          rank.textContent = String(index + 1).padStart(2, '0');
          const user = document.createElement('div');
          user.className = 'rank-user';
          user.textContent = member.username;
          const coins = document.createElement('div');
          coins.className = 'rank-coins';
          coins.textContent = String(member.coins);
          const label = document.createElement('span');
          label.textContent = 'COINS';
          coins.appendChild(label);
          row.append(rank, user, coins);
          list.appendChild(row);
      });
    }

    async function checkExpiryLogout() {
      if (timeLeft > 0 || autoLogoutTriggered || checkingExpiry) return;
      checkingExpiry = true;
      for (let attempt = 0; attempt < 3; attempt++) {
        try {
          const resp = await fetch('/api/hotspot/status').then(r => r.json());
          if (resp && resp.success && resp.data && resp.data.isLogin) {
            const serverTime = parseInt(resp.data.sessionTimeLeft) || 0;
            const serverUser = (resp.data.username || '').toLowerCase();
            const currentUser = (sessionUsername || '').toLowerCase();
            const sameUser = serverUser === currentUser;
            if (serverTime > 0 && sameUser) {
              console.log('[session] Same user still has time:', serverTime, '- aborting auto-logout (coin added to member)');
              timeLeft = serverTime;
              if (resp.data.logoutLink) logoutLink = resp.data.logoutLink;
              updateTimer();
              checkingExpiry = false;
              return;
            }
            if (serverTime > 0 && !sameUser) {
              console.log('[session] Different user detected:', serverUser, 'vs current:', currentUser, '- proceeding with logout so new session can take over');
            }
          }
          break;
        } catch (e) {
          console.log('[session] Server check attempt', attempt + 1, 'failed, retrying...');
          if (attempt < 2) await new Promise(r => setTimeout(r, 1000));
        }
      }
      checkingExpiry = false;
      autoLogoutTriggered = true;
      console.log('[session] Timer expired and server confirmed, triggering auto-logout');
      doLogout();
    }

    function connectWs() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${location.host}/ws/session`);
      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'status' && msg.data) {
            if (msg.data.isLogin) {
              document.getElementById('username').textContent = msg.data.username || 'User';
              const newTime = parseInt(msg.data.sessionTimeLeft) || 0;
              if (timeLeft > 0 && newTime > timeLeft + 2) {
                coinSuccessAudio.currentTime = 0;
                coinSuccessAudio.play().catch(() => {});
              }
              timeLeft = newTime;
              if (newTime > 0) autoLogoutTriggered = false;
              if (msg.data.logoutLink) logoutLink = msg.data.logoutLink;
              if (msg.data.username) sessionUsername = msg.data.username;
              if (msg.data.ip) sessionIp = msg.data.ip;
              if (msg.data.mac) sessionMac = msg.data.mac;
              if (msg.data.units && msg.data.ip && msg.data.units[msg.data.ip]) {
                setPcLabel(msg.data.units[msg.data.ip]);
              }
              if (msg.data.memberPoints !== undefined) setPoints(msg.data.memberPoints);
              else setPoints(null);
              updateTimer();
              checkExpiryLogout();
            }
          } else if (msg.type === 'settings' && activeDrawer === 'shop') {
            loadProducts();
          } else if (msg.type === 'logged-out') {
            setPoints(null);
            if (window.electronAPI && window.electronAPI.setSessionState) {
              window.electronAPI.setSessionState('logged-out');
            }
          }
        } catch (e) {}
      };
      ws.onclose = () => { ws = null; wsReconnectTimer = setTimeout(connectWs, 3000); };
      ws.onerror = () => { if (ws) ws.close(); };
    }

    function setPcLabel(name) {
      if (!name) return;
      const el = document.getElementById('pc-label');
      el.textContent = '[ ' + name + ' ]';
      el.classList.add('active');
    }

    function setPoints(pts) {
      const el = document.getElementById('points-zone');
      if (pts === undefined || pts === null) { el.classList.remove('active'); el.innerHTML = ''; return; }
      const display = pts % 1 === 0 ? pts.toString() : pts.toFixed(2);
      el.innerHTML = '<span class="pts-value">' + display + '</span><span class="pts-label">POINTS</span>';
      el.classList.add('active');
    }

    async function loadStatus() {
      if (previewMode) {
        sessionUsername = 'mem-player-one';
        timeLeft = 5278;
        document.getElementById('username').textContent = sessionUsername;
        setPcLabel('PC-07');
        setPoints(86.5);
        updateTimer();
        return;
      }
      try {
        const resp = await fetch('/api/hotspot/status');
        const data = await resp.json();
        if (data.success && data.data && data.data.isLogin) {
          document.getElementById('username').textContent = data.data.username || 'User';
          const newTime = parseInt(data.data.sessionTimeLeft) || 0;
          if (timeLeft > 0 && newTime > timeLeft + 2) {
            coinSuccessAudio.currentTime = 0;
            coinSuccessAudio.play().catch(() => {});
          }
          timeLeft = newTime;
          if (newTime > 0) autoLogoutTriggered = false;
          if (data.data.logoutLink) logoutLink = data.data.logoutLink;
          if (data.data.username) sessionUsername = data.data.username;
          if (data.data.ip) sessionIp = data.data.ip;
          if (data.data.mac) sessionMac = data.data.mac;
          if (data.data.units && data.data.ip && data.data.units[data.data.ip]) {
            setPcLabel(data.data.units[data.data.ip]);
          }
          if (data.data.memberPoints !== undefined) setPoints(data.data.memberPoints);
          else setPoints(null);
          updateTimer();
          checkExpiryLogout();
        }
      } catch (e) {}
    }

    const coinSuccessAudio = new Audio('sounds/coin-success.mp3');
    coinSuccessAudio.volume = 0.9;

    const sessionTickAudio = new Audio('sounds/tick.wav');
    const sessionWarnAudio = new Audio('sounds/warn-tick.wav');
    const sessionUrgentAudio = new Audio('sounds/urgent-tick.wav');
    const sessionFinalAudio = new Audio('sounds/final-beep.wav');
    [sessionTickAudio, sessionWarnAudio, sessionUrgentAudio, sessionFinalAudio].forEach(a => { a.volume = 0.8; });
    let lastTickedSession = -1;
    function playSessionTick(n) {
      if (n === lastTickedSession) return;
      lastTickedSession = n;
      try {
        let audio;
        if (n <= 3) audio = sessionFinalAudio;
        else if (n <= 10) audio = sessionUrgentAudio;
        else if (n <= 20) audio = sessionWarnAudio;
        else audio = sessionTickAudio;
        audio.currentTime = 0;
        audio.play().catch(() => {});
      } catch (e) {}
    }

    function updateTimer() {
      const el = document.getElementById('timer');
      const strip = document.getElementById('strip');
      const d = Math.floor(timeLeft / 86400);
      const h = Math.floor((timeLeft % 86400) / 3600);
      const m = Math.floor((timeLeft % 3600) / 60);
      const s = timeLeft % 60;
      el.textContent = d > 0
        ? d + 'd ' + String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0')
        : String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
      el.className = 'timer';
      strip.classList.remove('danger-mode');
      if (timeLeft <= 60) {
        el.classList.add('critical');
        strip.classList.add('danger-mode');
        if (timeLeft > 0) playSessionTick(timeLeft);
      }
    }

    async function doLogout() {
      document.getElementById('logout-btn').disabled = true;
      document.getElementById('logout-btn').textContent = '...';
      if (previewMode) {
        showOrderToast('DEMO: LOGOUT WOULD RETURN TO THE LOCK SCREEN');
        setTimeout(() => {
          document.getElementById('logout-btn').disabled = false;
          document.getElementById('logout-btn').textContent = 'LOGOUT';
        }, 1200);
        return;
      }
      const isMember = sessionUsername && sessionUsername.startsWith('mem-');

      try {
        await fetch('/api/pisonet/logout', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ ip: sessionIp, mac: sessionMac, username: sessionUsername })
        });
      } catch(e) { console.log('[session] pisonet/logout error:', e.message); }

      if (!isMember && logoutLink) {
        try {
          const eraseUrl = logoutLink + (logoutLink.includes('?') ? '&' : '?') + 'erase-cookie=on';
          const iframe = document.createElement('iframe');
          iframe.style.display = 'none';
          iframe.src = eraseUrl;
          document.body.appendChild(iframe);
          await new Promise(r => setTimeout(r, 3000));
          try { document.body.removeChild(iframe); } catch(_) {}
        } catch(e) { console.log('[session] mikrotik iframe logout error:', e.message); }
      }

      try { await fetch('/api/session/trigger', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({action: 'logged-out'}) }); } catch(e) {}
    }

    document.getElementById('logout-btn').addEventListener('click', (e) => { e.preventDefault(); doLogout(); });
    document.getElementById('shop-btn').addEventListener('click', () => openDrawer('shop'));
    document.getElementById('rank-btn').addEventListener('click', () => openDrawer('rank'));
    document.getElementById('drawer-close').addEventListener('click', closeDrawer);
    document.getElementById('clear-cart').addEventListener('click', () => { cart = {}; renderCart(); });
    document.getElementById('place-order').addEventListener('click', placeOrder);

    loadStatus();
    if (!previewMode) connectWs();
    interval = setInterval(() => {
      if (timeLeft > 0) {
        timeLeft--;
        updateTimer();
        if (timeLeft <= 0) checkExpiryLogout();
      }
    }, 1000);
  </script>
</body>
</html>
